<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Profile</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form id="profileForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="studentId" class="form-label">Student ID</label>
                        <input type="text" id="studentId" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" readonly>
                    </div>

                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" id="firstName" class="form-control" placeholder="Enter first name">
                    </div>

                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" id="lastName" class="form-control" placeholder="Enter last name">
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" id="phone" class="form-control" placeholder="Enter phone number">
                    </div>

                    <div class="col-md-6">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" id="address" class="form-control" placeholder="Enter address">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" id="updateBtn" class="btn btn-primary">
                        Update Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const messageBox = document.getElementById("message");
    const profileForm = document.getElementById("profileForm");
    const updateBtn = document.getElementById("updateBtn");

    const studentIdInput = document.getElementById("studentId");
    const emailInput = document.getElementById("email");
    const firstNameInput = document.getElementById("firstName");
    const lastNameInput = document.getElementById("lastName");
    const phoneInput = document.getElementById("phone");
    const addressInput = document.getElementById("address");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        async function loadProfile() {
            messageBox.innerHTML = "";

            try {
                const response = await fetch('/api/students/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                    return;
                }

                    let result = null;
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.includes("application/json")) {
                        result = await response.json();
                    }

                    if (!response.ok) {
                        messageBox.innerHTML =
                            `<div class="alert alert-danger">${result?.message || 'Failed to load profile.'}</div>`;
                        return;
                    }

                    studentIdInput.value = result.studentId ?? '';
                    emailInput.value = result.email ?? '';
                    firstNameInput.value = result.firstName ?? '';
                    lastNameInput.value = result.lastName ?? '';
                    phoneInput.value = result.phone ?? '';
                    addressInput.value = result.address ?? '';

                } catch (error) {
                    console.error("Error loading profile:", error);
                    messageBox.innerHTML =
                        `<div class="alert alert-danger">Something went wrong while loading profile.</div>`;
                }
            }

            profileForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                messageBox.innerHTML = "";

                const requestBody = {
                    firstName: firstNameInput.value.trim() || null,
                    lastName: lastNameInput.value.trim() || null,
                    phone: phoneInput.value.trim() || null,
                    address: addressInput.value.trim() || null
                };

                try {
                    updateBtn.disabled = true;
                    updateBtn.textContent = "Updating...";

                    const response = await fetch('/api/students/me', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (response.status === 401 || response.status === 403) {
                        localStorage.clear();
                        window.location.href = [[ @{/login} ]];
                        return;
                    }

                        let result = null;
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            result = await response.json();
                        }

                        if (response.ok) {
                            messageBox.innerHTML =
                                `<div class="alert alert-success">Profile updated successfully.</div>`;
                            await loadProfile();
                        } else {
                            messageBox.innerHTML =
                                `<div class="alert alert-danger">${result?.message || 'Failed to update profile.'}</div>`;
                        }

                    } catch (error) {
                        console.error("Error updating profile:", error);
                        messageBox.innerHTML =
                            `<div class="alert alert-danger">Something went wrong while updating profile.</div>`;
                    } finally {
                        updateBtn.disabled = false;
                        updateBtn.textContent = "Update Profile";
                    }
                });

                function logout() {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                }

                    loadProfile();
</script>

</body>
</html>
