<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Invoices</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div id="loading">Loading invoices...</div>

            <div class="table-responsive">
                <table class="table table-striped align-middle" id="invoiceTable" style="display: none;">
                    <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="invoiceBody"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const invoiceBody = document.getElementById("invoiceBody");
    const invoiceTable = document.getElementById("invoiceTable");
    const loading = document.getElementById("loading");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

    if (role !== "STUDENT") {
        window.location.href = [[ @{/admin/dashboard} ]];
    }

    async function loadInvoices() {
        messageBox.innerHTML = "";

        try {
            const response = await fetch([[ @{/api/finance/my-invoices} ]], {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
                return;
            }

            const result = await response.json();

            if (!response.ok) {
                let errorHtml = result.message
                    ? `<div>${result.message}</div>`
                    : `<div>Failed to load invoices.</div>`;

                if (result.validationErrors) {
                    for (const field in result.validationErrors) {
                        errorHtml += `<div>${result.validationErrors[field]}</div>`;
                    }
                }

                messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                loading.style.display = "none";
                return;
            }

            invoiceBody.innerHTML = "";

            if (result.length === 0) {
                invoiceBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">No invoices found</td>
                    </tr>
                `;
            } else {
                result.forEach(invoice => {

                    let statusBadge = `<span class="badge bg-secondary">${invoice.status}</span>`;

                    if (invoice.status === "PENDING") {
                        statusBadge = `<span class="badge bg-warning text-dark">PENDING</span>`;
                    } else if (invoice.status === "PAID") {
                        statusBadge = `<span class="badge bg-success">PAID</span>`;
                    }

                    let actionButton = "";

                    if (invoice.status === "PENDING") {
                        actionButton = `
                            <button class="btn btn-sm btn-primary"
                                    onclick="payInvoice('${invoice.reference}')">
                                Pay
                            </button>
                        `;
                    } else {
                        actionButton = `<span class="text-muted">-</span>`;
                    }

                    const row = `
                        <tr>
                            <td>${invoice.reference ?? ''}</td>
                            <td>${invoice.invoiceType ?? ''}</td>
                            <td>${invoice.amount ?? ''}</td>
                            <td>${statusBadge}</td>
                            <td>${invoice.createdAt ?? ''}</td>
                            <td>${actionButton}</td>
                        </tr>
                    `;

                    invoiceBody.innerHTML += row;
                });
            }

            loading.style.display = "none";
            invoiceTable.style.display = "table";

        } catch (error) {
            messageBox.innerHTML =
                `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
            loading.style.display = "none";
        }
    }

    async function payInvoice(reference) {
        messageBox.innerHTML = "";

        try {
            const response = await fetch([[ @{/api/finance/pay} ]], {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    reference: reference
                })
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
                return;
            }

            const result = await response.json();

            if (!response.ok) {
                let errorHtml = result.message
                    ? `<div>${result.message}</div>`
                    : `<div>Failed to pay invoice.</div>`;

                if (result.validationErrors) {
                    for (const field in result.validationErrors) {
                        errorHtml += `<div>${result.validationErrors[field]}</div>`;
                    }
                }

                messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                return;
            }

            messageBox.innerHTML = `
                <div class="alert alert-success">
                    <strong>Invoice paid successfully.</strong><br>
                    Reference: ${result.reference}<br>
                    Amount: ${result.amount}<br>
                    Status: ${result.status}
                </div>
            `;

            loadInvoices();

        } catch (error) {
            messageBox.innerHTML =
                `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = [[ @{/login} ]];
    }

    loadInvoices();
</script>

</body>
</html>
