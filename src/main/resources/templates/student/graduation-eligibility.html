<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Graduation Eligibility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Graduation Eligibility</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body" id="eligibilityContainer">
            <p class="mb-0">Checking graduation eligibility...</p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const messageBox = document.getElementById("message");
    const eligibilityContainer = document.getElementById("eligibilityContainer");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        async function loadGraduationEligibility() {
            messageBox.innerHTML = "";

            try {
                const response = await fetch('/api/students/me/graduation-eligibility', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                    return;
                }

                    const result = await response.json();

                    if (!response.ok) {
                        let errorHtml = result.message
                            ? `<div>${result.message}</div>`
                            : `<div>Failed to check graduation eligibility.</div>`;

                        if (result.validationErrors) {
                            for (const field in result.validationErrors) {
                                errorHtml += `<div>${result.validationErrors[field]}</div>`;
                            }
                        }

                        messageBox.innerHTML =
                            `<div class="alert alert-danger">${errorHtml}</div>`;

                        eligibilityContainer.innerHTML = "";
                        return;
                    }

                    const statusBadge = result.eligible
                        ? `<span class="badge bg-success fs-6">Eligible</span>`
                        : `<span class="badge bg-danger fs-6">Not Eligible</span>`;

                    const alertClass = result.eligible
                        ? 'alert-success'
                        : 'alert-warning';

                    eligibilityContainer.innerHTML = `
                <h4 class="mb-3">Eligibility Status</h4>
                ${statusBadge}

                <p class="mt-3"><strong>Student ID:</strong> ${result.studentId ?? ''}</p>

                <div class="alert ${alertClass} mt-2 mb-0">
                    ${result.message ?? ''}
                </div>
            `;

                } catch (error) {
                    messageBox.innerHTML =
                        `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;

                    eligibilityContainer.innerHTML = "";
                }
            }

            function logout() {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
            }

                loadGraduationEligibility();
</script>

</body>
</html>
