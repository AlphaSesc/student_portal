<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Enrollments</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <a th:href="@{/courses}" class="btn btn-outline-secondary btn-sm me-2">Courses</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Enrollment ID</th>
                        <th>Student ID</th>
                        <th>Course ID</th>
                        <th>Course Code</th>
                        <th>Course Title</th>
                        <th>Enrolled At</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="enrollmentsTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading enrollments...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const messageBox = document.getElementById("message");
    const tableBody = document.getElementById("enrollmentsTableBody");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

        async function loadEnrollments() {
            try {
                const response = await fetch('/api/enrollments/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.clear();
                    window.location.href = [[ @{/login} ]];
                    return;
                }

                    if (!response.ok) {
                        tableBody.innerHTML =
                            `<tr><td colspan="7" class="text-center text-danger">Failed to load enrollments.</td></tr>`;
                        return;
                    }

                    const enrollments = await response.json();

                    if (!enrollments || enrollments.length === 0) {
                        tableBody.innerHTML =
                            `<tr><td colspan="7" class="text-center">No enrollments found.</td></tr>`;
                        return;
                    }

                    tableBody.innerHTML = "";

                    enrollments.forEach(enrollment => {
                        const enrolledAt = enrollment.enrolledAt
                            ? new Date(enrollment.enrolledAt).toLocaleString()
                            : "";

                        const row = `
                    <tr>
                        <td>${enrollment.enrollmentId ?? ''}</td>
                        <td>${enrollment.studentId ?? ''}</td>
                        <td>${enrollment.courseId ?? ''}</td>
                        <td>${enrollment.courseCode ?? ''}</td>
                        <td>${enrollment.courseTitle ?? ''}</td>
                        <td>${enrolledAt}</td>
                        <td>
                            <a href="/courses/${enrollment.courseId}" class="btn btn-outline-primary btn-sm">
                                View Course
                            </a>
                        </td>
                    </tr>
                `;

                        tableBody.innerHTML += row;
                    });

                } catch (error) {
                    console.error("Error loading enrollments:", error);
                    tableBody.innerHTML =
                        `<tr><td colspan="7" class="text-center text-danger">Something went wrong while loading enrollments.</td></tr>`;
                }
            }

            function logout() {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
            }

                loadEnrollments();
</script>

</body>
</html>
