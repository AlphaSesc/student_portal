<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Student Dashboard</h2>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>

    <!-- Welcome -->
    <div class="card p-3 mb-4 shadow-sm">
        <h5>Welcome</h5>
        <p id="userInfo" class="mb-0"></p>
    </div>

    <!-- Navigation Cards -->
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h5>Courses</h5>
                <p>Browse and enrol in courses</p>
                <a th:href="@{/courses}" class="btn btn-primary btn-sm">View Courses</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h5>My Enrolments</h5>
                <p>View your enrolled courses</p>
                <a th:href="@{/my-enrollments}" class="btn btn-primary btn-sm">View</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h5>Profile</h5>
                <p>View and update your profile</p>
                <a th:href="@{/student-profile}" class="btn btn-primary btn-sm">Go</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h5>Invoices</h5>
                <p>View your invoices</p>
                <a th:href="@{/invoices}" class="btn btn-primary btn-sm">View</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm text-center">
                <h5>Graduation</h5>
                <p>Check eligibility status</p>
                <a th:href="@{/graduation}" class="btn btn-primary btn-sm">Check</a>
            </div>
        </div>

    </div>
</div>

<script>
    // 🔐 Check login
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "/login";
    }

    // 👤 Show user info
    const email = localStorage.getItem("email");
    const role = localStorage.getItem("role");

    document.getElementById("userInfo").innerText =
        `Logged in as: ${email} (${role})`;

    // 🚪 Logout
    function logout() {
        localStorage.clear();
        window.location.href = "/login";
    }
</script>

</body>
</html>
