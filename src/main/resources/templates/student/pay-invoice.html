<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Pay Invoice</h2>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm me-2">Dashboard</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form id="payInvoiceForm">
                <div class="mb-3">
                    <label for="reference" class="form-label">Invoice Reference</label>
                    <input type="text" class="form-control" id="reference" placeholder="Enter invoice reference" required>
                </div>

                <button type="submit" class="btn btn-primary">Pay Invoice</button>
            </form>
        </div>
    </div>

</div>

<script th:inline="javascript">
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    const messageBox = document.getElementById("message");
    const payInvoiceForm = document.getElementById("payInvoiceForm");
    const referenceInput = document.getElementById("reference");

    if (!token) {
        window.location.href = [[ @{/login} ]];
    }

    if (role !== "STUDENT") {
        window.location.href = [[ @{/admin/dashboard} ]];
    }

    payInvoiceForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        messageBox.innerHTML = "";

        const reference = referenceInput.value.trim();

        if (!reference) {
            messageBox.innerHTML = `<div class="alert alert-danger">Invoice reference is required.</div>`;
            return;
        }

        try {
            const response = await fetch([[ @{/api/finance/pay} ]], {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    reference: reference
                })
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.clear();
                window.location.href = [[ @{/login} ]];
                return;
            }

            const result = await response.json();

            if (!response.ok) {
                let errorHtml = result.message
                    ? `<div>${result.message}</div>`
                    : `<div>Failed to pay invoice.</div>`;

                if (result.validationErrors) {
                    for (const field in result.validationErrors) {
                        errorHtml += `<div>${result.validationErrors[field]}</div>`;
                    }
                }

                messageBox.innerHTML = `<div class="alert alert-danger">${errorHtml}</div>`;
                return;
            }

            messageBox.innerHTML = `
                <div class="alert alert-success">
                    <div><strong>Invoice paid successfully.</strong></div>
                    <div><strong>Reference:</strong> ${result.reference ?? ''}</div>
                    <div><strong>Amount:</strong> ${result.amount ?? ''}</div>
                    <div><strong>Status:</strong> ${result.status ?? ''}</div>
                </div>
            `;

            payInvoiceForm.reset();

        } catch (error) {
            messageBox.innerHTML =
                `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
        }
    });

    function logout() {
        localStorage.clear();
        window.location.href = [[ @{/login} ]];
    }
</script>

</body>
</html>
