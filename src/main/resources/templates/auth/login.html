<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h2 class="text-center mb-4">Login</h2>

                <div id="message"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <p class="mt-3 text-center mb-0">
                    Don’t have an account?
                    <a th:href="@{/register}">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const loginForm = document.getElementById("loginForm");
    const messageBox = document.getElementById("message");

    loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        messageBox.innerHTML = "";

        const data = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch([[ @{/api/auth/login} ]], {
                method: "POST",
                    headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                localStorage.setItem("token", result.token);
                localStorage.setItem("email", result.email);
                localStorage.setItem("role", result.role);

                messageBox.innerHTML =
                    `<div class="alert alert-success">Login successful. Redirecting...</div>`;

                setTimeout(() => {
                    window.location.href = [[ @{/dashboard} ]];
                }, 1000);
                } else {
                    let errorHtml = result.message
                        ? `<div>${result.message}</div>`
                        : `<div>Login failed.</div>`;

                    if (result.validationErrors) {
                        for (const field in result.validationErrors) {
                            errorHtml += `<div>${result.validationErrors[field]}</div>`;
                        }
                    }

                    messageBox.innerHTML =
                        `<div class="alert alert-danger">${errorHtml}</div>`;
                }
            } catch (error) {
                messageBox.innerHTML =
                    `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
            }
        });
</script>

</body>
</html>
